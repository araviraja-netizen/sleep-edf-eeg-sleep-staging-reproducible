[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleep-stage-classification"
version = "0.2.0"
description = "Reproducible Sleep-EDF Expanded inspection and EEG dataset preparation"
requires-python = ">=3.11"
authors = [{name = "Ravi Raja Akurathi"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch", "numpy", "scipy", "PyYAML", "mne", "matplotlib", "pandas", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
