version: phase4-v1
protocol: A
window: 5
seed: 42
device: mps
precision: float32
batch_size: 16
resource_fallback_batch: 8
num_workers: 0
max_open_recordings: 128
max_epochs: 25
early_stopping: {patience: 8, min_delta: 0.0}
optimizer: {name: AdamW, learning_rate: 0.001, weight_decay: 0.01, betas: [0.9, 0.999], eps: 1.0e-8}
scheduler: {name: none}
selection_metric: validation_macro_f1
